---
exclude_paths:
  - '.git/**'
  - '**/bin/**'
  - '**/obj/**'
  - '**/*.dll'
  - '**/*.exe'
  - 'TestResults/**'

engines:
  sonarcs:
    enabled: true
    exclude_rules:
      # Optional parameters should not be used. The Refit interfaces in Datadog.Api/Interfaces
      # map optional method parameters onto optional query-string parameters, which is how Refit
      # is meant to be used. Overloads cannot express this: an endpoint with eight optional
      # filters would need every combination of them, and Refit requires one HTTP attribute per
      # method. The alternative — a query-object parameter per endpoint — would be a breaking
      # change to the published API surface.
      - 'S2360'
